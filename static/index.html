</head><body><canvas id="sky"></canvas>
<header><h1 onclick="go('#/')">✦ 다시만날별 ✦</h1><p>무지개다리를 건넌 반려동물을 추억하고 다시 만나는 공간</p></header><main id="app"><div class="card center"><div class="orb">✦</div><p>불러오는 중이에요…</p></div></main><footer>🛡 데이터 안심 약속 · 올려주신 사진과 글은 관리 키로 언제든 통째로 내려받을 수 있어요. 서비스를 종료하게 되더라도 충분한 기간 전에 미리 알려드리고 내려받을 시간을 드릴게요.</footer><nav class="tabs"><a href="#/" data-t="home"><b>✨</b>별자리</a><a href="#/memories" data-t="memories"><b>📷</b>추억</a><a href="#/comfort" data-t="comfort"><b>🤍</b>위로</a><a href="#/mine" data-t="mine"><b>🐾</b>내 아이</a></nav>
<script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=h=>location.hash=h;let KEYS=JSON.parse(localStorage.keys||'{}');const kOf=u=>{const m=u.match(/\/api\/pets\/(\d+)/);return m&&KEYS[m[1]]};
const api=(u,o,ms)=>{const hd={'Content-Type':'application/json'},k=kOf(u);if(k)hd['X-Edit-Key']=k;if(window.__ADMIN_TOKEN&&String(u).startsWith('/api/admin/'))hd['X-Admin-Token']=window.__ADMIN_TOKEN;const ctrl=new AbortController();const timer=ms?setTimeout(()=>ctrl.abort(),ms):0;return fetch(u,Object.assign(o?{method:'POST',headers:hd,body:JSON.stringify(o)}:{headers:hd},{signal:ctrl.signal})).then(async r=>{const t=await r.text();try{return t?JSON.parse(t):{}}catch(e){const err=new Error('bad');err.status=r.status;throw err}}).finally(()=>{if(timer)clearTimeout(timer)})};
function loadingHtml(){return '<div class="card center"><div class="orb">✦</div><p>불러오는 중이에요…</p></div>'}
function errHtml(msg){return `<div class="card center"><p class="err">${esc(msg||'불러오지 못했어요.')}</p><button class="btn" onclick="route()">다시 시도</button></div>`}
const saveKey=(id,k)=>{KEYS[id]=k;localStorage.keys=JSON.stringify(KEYS);if(!MINE.includes(+id)){MINE.push(+id);localStorage.mine=JSON.stringify(MINE)}};
const jo=(w,a,b)=>{const c=(w||'').charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const emo=s=>({'강아지':'🐶','고양이':'🐱','토끼':'🐰','햄스터':'🐹','새':'🐦'}[s]||'🐾');
const fmt=d=>d?d.replace(/-/g,'.'):'';const ago=t=>new Date(t*1000).toLocaleDateString('ko-KR');
async function home(){let ps;try{ps=await api('/api/pets',null,12000)}catch(e){app.innerHTML=errHtml('별자리 목록을 불러오지 못했어요. 서버 응답이 지연되고 있어요.');return}if(!Array.isArray(ps)){app.innerHTML=errHtml((ps&&ps.error)||'별자리 목록을 불러오지 못했어요.');return}app.innerHTML=`<h2 class="ptitle">무지개다리를 건넌 반려동물 추모공간</h2><div class="live"><span class="dot"></span>지금 <b id="onl">${LIVE.online||1}</b>명이 함께 있어요</div><div class="ticker"><span id="tk">별빛을 기다리고 있어요 ✦</span></div><div id="pzinfo" class="pzinfo"></div><div id="plaza" class="plaza"></div><div class="herobox"><div style="font-size:30px">🌙✨🐾</div><h2>우리 아이의 가장 행복했던 순간을<br>다시 만나요</h2><p>사진 한 장이면, 아이가 신나게 뛰놀다 품에 쏙 안기는 10초 영상이 돼요.</p></div><div class="center"><a class="btn" href="#/new">＋ 별자리 만들기</a><p style="font-size:13px;opacity:.8;margin:8px 0 0">슬픈 기억을 다시 보는 게 아니라,<br>우리 아이의 가장 행복했던 순간을 다시 만나요 🐾</p></div>
${ps.length?'':`<div class="card center" style="padding:28px 16px"><div style="font-size:40px">🌌</div><h3>아직 밤하늘에 별자리가 없어요</h3><p>첫 번째 별자리를 만들어 우리 아이를 기억해 주세요.</p><a class="btn" href="#/new">✨ 별자리 만들기</a></div>`}<div class="grid">${ps.map(p=>`<div class="locker" onclick="go('#/pet/${p.id}')"><span class="no">별자리 No.${String(p.id).padStart(3,'0')}</span>${p.example?'<span class="tag">예시</span>':''}
${p.photo?`<img src="${p.photo}" alt="">`:`<div class="ph">${emo(p.species)}</div>`}<b>${esc(p.name)}</b><small>${fmt(p.birth)}${p.birth||p.passed?' ~ ':''}${fmt(p.passed)}</small><br><small>🕯 ${p.candles}</small></div>`).join('')}</div>`;plaza(ps)}
function form(E){app.innerHTML=`<div class="card"><h2 style="margin:0">${E?'별자리 수정하기':'별자리 만들기'}</h2>
<label>아이 이름 *</label><input id="f_name" maxlength="40" placeholder="예: 콩이">
<label>종류</label><select id="f_species"><option>강아지</option><option>고양이</option><option>토끼</option><option>햄스터</option><option>새</option><option>기타</option></select>
<div class="row"><div><label>태어난 날</label><input type="date" id="f_birth"></div><div><label>별이 된 날</label><input type="date" id="f_passed"></div></div>
<label>사진</label><input type="file" id="f_photo" accept="image/*"><img id="prev" style="display:none;width:100%;border-radius:12px;margin-top:8px">
<label>보호자 이름</label><input id="f_owner" maxlength="30" placeholder="예: 엄마, 누나">
<label>아이에게 쓰는 편지</label><textarea id="f_letter" placeholder="보고 싶은 마음을 적어 주세요."></textarea>

function consOf(k){const c=CONS[k%CONS.length],r=Math.floor(k/CONS.length);return {...c,t:c.n+(r?' '+(r+1):'')}}
function constellationGroups(ps){
  // Slots are a view over the public list, ordered by id. example=1 is the seeded sample flag, not a saved constellation assignment.
  const list=[...ps].filter(p=>!p.example).sort((a,b)=>(+a.id)-(+b.id));
  const groups=[];let k=0,i=0;
  while(i<list.length){const c=consOf(k),g=list.slice(i,i+c.p.length);groups.push({c,g});i+=g.length;k++}
  if(!groups.length||groups[groups.length-1].g.length===groups[groups.length-1].c.p.length)groups.push({c:consOf(groups.length),g:[]});
  const cur=groups.length-1,done=cur,def=done&&!groups[cur].g.length?done-1:cur;
  return {groups,cur,done,def};
}
