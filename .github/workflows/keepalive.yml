name: Keep Render alive

on:
  schedule:
    # Intended every 10 minutes. GitHub may delay or skip scheduled runs,
    # so this does not by itself guarantee the instance stays under Render's idle window.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check process and pet list
        run: |
          set -euo pipefail
          base="https://dasi-mannal-byeol.onrender.com"
          # health: the process accepted the request. pets: the list the app paints on launch.
          probe() {
            local path="$1" max="$2" out code
            out="$(curl --silent --show-error \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time "$max" \
              --output /dev/null \
              --write-out '%{http_code} %{time_starttransfer}' \
              "$base$path" || true)"
            echo "$path ${out:-000 0}"
            code="${out%% *}"
            [ "$code" = "200" ]
          }
          probe /api/health 20
          probe /api/pets 20
