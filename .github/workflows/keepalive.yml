name: Keep Render alive

on:
  schedule:
    # Every 10 minutes. Render's free instance sleeps after ~15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: GET /api/pets
        run: |
          set -euo pipefail
          url="https://dasi-mannal-byeol.onrender.com/api/pets"
          # --max-time is per transfer; --retry 3 is up to three more attempts.
          # --fail makes HTTP 4xx/5xx a curl error so they are retried and fail the step.
          code="$(curl --silent --show-error --fail \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 60 \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$url")" || {
            echo "request failed (HTTP ${code:-000})" >&2
            exit 1
          }
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "expected HTTP 200 from ${url}" >&2
            exit 1
          fi
